name: Tests and package

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.10.0"
            requirements: requirements-test.txt
          - homeassistant: "2026.11.2"
            requirements: requirements-test-current.txt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run regression tests
        run: python -m pytest -q

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Build manual-install archive
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          root = Path("custom_components/svago")
          version = json.loads((root / "manifest.json").read_text())["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[ab]\d+|rc\d+)?", version):
              raise SystemExit("Unexpected release version")
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              if os.environ["GITHUB_REF_NAME"] != version:
                  raise SystemExit("Use a release tag matching the manifest version exactly")
          files = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.suffix in {".py", ".json", ".png", ".yaml", ".yml"}
              and "__pycache__" not in path.parts
          )
          files += [
              Path(name) for name in (
                  "README.md", "LICENSE", "NOTICE", "CHANGELOG.md",
                  "VALIDATION.md", "CONTRIBUTING.md",
              )
          ]
          for directory, suffixes in (
              ("docs", {".md"}), ("examples", {".yaml", ".yml"}),
          ):
              files.extend(
                  path for path in Path(directory).rglob("*")
                  if path.is_file() and path.suffix in suffixes
                  and not any(part.startswith(".") for part in path.parts)
              )
          files = sorted(files)
          destination = Path("dist")
          destination.mkdir(exist_ok=True)
          archive = destination / f"svago-home-assistant-{version}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as output:
              for path in files:
                  output.write(path, path.as_posix())
          with zipfile.ZipFile(archive) as output:
              if output.testzip() is not None:
                  raise SystemExit("Archive integrity check failed")
              if len(output.namelist()) != len(set(output.namelist())):
                  raise SystemExit("Archive contains duplicate names")
              included = set(output.namelist())
              for path in files:
                  if path.suffix != ".md":
                      continue
                  for link in re.findall(r"\]\(([^)]+)\)", path.read_text()):
                      if ":" in link or link.startswith("#"):
                          continue
                      target = (path.parent / link.split("#", 1)[0]).resolve()
                      if target.relative_to(Path.cwd()).as_posix() not in included:
                          raise SystemExit(f"Unpackaged documentation link in {path}: {link}")
          print(archive)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: svago-manual-install
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
